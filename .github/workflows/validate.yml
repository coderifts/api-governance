# The validators existed; nothing ran them.
#
# This repo is CodeRifts' public distribution hub — mcp.json, the Copilot kit, the Codex/OpenAI
# package, the Cursor plugin, and tools.wire.v1.json, which coderifts-app's surface-anchor.json
# names as its source_ref pin target. Four validator scripts were written and none was wired: not
# into package scripts, not into CI. That is how the repo reached five days stale while every file
# in it looked reviewed.
#
# tools-wire is the one with an external obligation: the anchor's status text promises that every
# surface change gets a NEW tag. If the live surface moves and this repo is not re-tagged, the
# anchor points at an old surface while still looking authoritative. This workflow is the half of
# that promise which lives here; the other half is the app's own --verify-source-ref gate.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  # The wire target can go stale without anything in THIS repo changing — the live surface moves
  # elsewhere. Push/PR alone would never notice, so it is also checked on a schedule.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# MEASURED 2026-09-13: this file declared no permissions at all, so every job here ran with the
# repository default — which on a repo whose default is permissive is write access to contents,
# issues, packages and more, handed to a job that only reads files and makes one outbound fetch.
# Naming the minimum is not paperwork: it is what stops a compromised step in a CI job from being
# able to act as the repository.
permissions:
  contents: read # reads the repo and fetches the live surface; writes nothing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes. Keeping the token in .git/config only widens what a later step
          # could do with it. (The action itself is still tag-pinned — see the ordering note in
          # the hardening report; this repo's publish workflow was pinned first.)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Offline: these compare vendored files against each other and against the repo's own trees.
      - name: Validate OpenAI/Codex package
        run: npm run validate:openai
      - name: Validate Copilot kit
        run: npm run validate:copilot
      - name: Validate Cursor plugin
        run: npm run validate:cursor

      # Network: fetches the live tools/list and compares. This is the source_ref obligation.
      #
      # ⚠ TWO PATHS FOR ONE CONDITION, and they disagree on purpose (2026-09-23).
      #
      # The validator treats a transport failure — DNS, timeout, 5xx — as SKIPPED and exits 0, so a
      # flaky network never trains anyone to re-run until green. That is right on a pull request and
      # WRONG on a schedule: the schedule exists precisely because the live surface can move without
      # anything in this repository changing, so a scheduled run that skips the comparison has
      # achieved nothing and reports `success`. The same silent green the schedule was added to
      # replace, now on the record.
      #
      # MEASURED 2026-09-23: app.coderifts.com answered HTTP 502 for about a minute — four
      # independent live gates in the website repo went red together and green on retry. Had that
      # minute landed on the 06:17 cron, this step would have skipped and the run would have passed.
      # Also measured, across the last 20 runs of this workflow: no skip has actually happened yet.
      # Every run that reached this step printed OK, and the 2026-09-22 scheduled failure was the
      # Cursor-plugin step above, which never let this one start. A latent defect, closed before it
      # fires.
      #
      # `--require-live` is what turns a skip into a failure. It is a FLAG, not a sniffed environment
      # variable: the workflow states the intent, the validator obeys it, and the negative control
      # drives the same flag a human would.
      - name: Validate wire-format pin target against the live surface (scheduled — live REQUIRED)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run validate:tools-wire:scheduled

      - name: Validate wire-format pin target against the live surface (PR/push — skip is a warning)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm run validate:tools-wire

      # The control for both paths. It stands up a local socket that answers 502 the way a failing
      # gateway does, runs the validator twice against it, and asserts the two exit codes DISAGREE —
      # plus that the real surface still passes, because a suite that only proves a gate can fail has
      # not shown the gate is usable.
      - name: Negative control for both network-unavailable paths
        run: npm run selftest:tools-wire-modes

      # The RECORDED fallback below cannot see a snapshot that fell behind its source — the app
      # checkout is private, so CI never runs LIVE. This gate covers exactly that blind spot,
      # against a public anchor (the rule text published in @coderifts/sdk). Removing it turns the
      # kit validators' RECORDED pass back into the silent green it was before 2026-09-14.
      - name: Validate recorded rule text against the published policy
        run: npm run validate:rule-provenance
